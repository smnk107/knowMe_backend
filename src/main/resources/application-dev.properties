

spring.datasource.url=jdbc:postgresql://localhost:5434/docmind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.max-tokens=500
spring.ai.openai.chat.options.temperature=0.2

spring.ai.openai.embedding.options.model=text-embedding-3-small


# =========================
# RAG Configuration
# =========================

# Target chunk size in tokens
app.rag.chunk-size=800

# Minimum characters before looking for a punctuation-based split
app.rag.min-chunk-size-chars=350

# Minimum chunk length to keep/embed
app.rag.min-chunk-length-to-embed=5

# Maximum number of chunks generated from one document
app.rag.max-num-chunks=10000

# Keep separators such as newline characters
app.rag.keep-separator=true

# Token encoding
app.rag.encoding-type=CL100K_BASE

# Punctuation marks used as preferred chunk boundaries
app.rag.punctuation-marks=.,?,!,\n,;,:

# =========================
# Retrieval Configuration
# =========================

app.rag.top-k=5
app.rag.similarity-threshold=0.70

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=*
cors.allowed-headers=*
cors.allow-credentials=false



# =====================================================
# PGVector
# =====================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# text-embedding-3-small = 1536 dimensions
spring.ai.vectorstore.pgvector.dimensions=1536

# Let Spring AI create the vector_store table/index
spring.ai.vectorstore.pgvector.initialize-schema=true

logging.level.org.springframework.web.client=TRACE
logging.level.org.springframework.ai=DEBUG
logging.level.com.openai=DEBUG

# Multipart File Upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
